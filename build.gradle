plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.5.0'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
}

group 'com.luigivampa92.remoteandroidbuilds'
version '0.5.2'

sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

tasks {
    buildSearchableOptions {
        enabled = false
    }
    prepareSandbox {
        enabled = true
    }
    instrumentCode {
        enabled = false
    }
    instrumentTestCode {
        enabled = false
    }
}

task buildAndRun {
    group = 'run'
    description = 'Сборка и запуск плагина в Android Studio'
    dependsOn('build', 'runIde')
    tasks.findByName('runIde').mustRunAfter('build')
}

task quickReload {
    group = 'run'
    description = 'Быстрое обновление плагина без полной пересборки'
    dependsOn('prepareSandbox', 'runIde')
    tasks.findByName('runIde').mustRunAfter('prepareSandbox')
}

task buildJar {
    group = 'run'
    description = 'Сборка JAR файла плагина'
    dependsOn('jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    intellijPlatform {
        local('/Users/nazarov/Applications/Android Studio.app/Contents')
        bundledPlugins(['org.jetbrains.android'])
        javaCompiler()
    }
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

intellijPlatform {
    pluginConfiguration {
        name = 'SkyForge'
        version = rootProject.version
        
        ideaVersion {
            sinceBuild = "243"
            untilBuild = "251.*"
        }
        
        description = file("extra/pluginDescription.html").text
        changeNotes = file("extra/pluginChangeNotes.html").text
    }
    
    signing {
        certificateChainFile = file("signing/chain.crt")
        privateKeyFile = file("signing/private.pem")
        def passwordFile = file("signing/private_key_password")
        password = passwordFile.exists() ? passwordFile.text : ""
    }
    
    runIde {
        jvmArguments = [
            "-Xmx2g", 
            "-XX:ReservedCodeCacheSize=512m",
            "-Didea.auto.reload.plugins=true"
        ]
    }
}